name: Job 1 tests (#23)

# Runs every job-1 test directory present: the builder's own regression tests
# (tests/job1_claude or tests/job1_codex) and the other builder's cross tests
# (tests/job1_cross_by_*). Local Git remotes, mocked Vercel/GitHub and temp roots only.
on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install test dependencies
        run: python -m pip install --quiet pytest ruff
      - name: Lint job 1 files
        run: |
          files=$(ls -d tests/job1_* bin/site_route_owners.py 2>/dev/null || true)
          if [ -n "$files" ]; then ruff check --select E9,F $files; fi
      - name: Run job 1 tests
        run: |
          git config --global user.name "Job 1 CI"
          git config --global user.email "job1-ci@example.invalid"
          dirs=$(ls -d tests/job1_* 2>/dev/null || true)
          if [ -z "$dirs" ]; then echo "no job 1 tests on this branch"; exit 1; fi
          python -m pytest -q $dirs
