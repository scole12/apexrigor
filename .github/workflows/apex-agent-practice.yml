name: APEX agent practice
# Job 3 (scole12/apexrigor): CI runs only on the final pull request into main or by hand.
# No push-to-branch trigger. Build and test happen on the Geekom.
on:
  pull_request:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
jobs:
  practice:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python tools/check_agent_practice.py
