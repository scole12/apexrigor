name: NHL product delivery
run-name: NHL ${{ inputs.product }} ${{ inputs.slate_date }}

on:
  workflow_dispatch:
    inputs:
      product:
        description: NHL product to deliver (sealed artifacts committed under data/nhl/<slate_date>/)
        required: true
        type: choice
        options:
          - T3
          - T2
      slate_date:
        description: NHL slate date (YYYY-MM-DD)
        required: true
        type: string

permissions:
  contents: read

jobs:
  deliver:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      PRODUCT: ${{ inputs.product }}
      SLATE_DATE: ${{ inputs.slate_date }}
      SMTP_HOST: ${{ secrets.NCAAF_SMTP_HOST }}
      SMTP_PORT: ${{ secrets.NCAAF_SMTP_PORT }}
      SMTP_USER: ${{ secrets.NCAAF_SMTP_USER }}
      SMTP_PASSWORD: ${{ secrets.NCAAF_SMTP_PASSWORD }}
    steps:
      - uses: actions/checkout@v4
      - name: Send the sealed NHL artifacts exactly as recorded in the delivery manifest
        shell: bash
        run: |
          python3 - <<'PY'
          from email.message import EmailMessage
          from email.policy import SMTP
          from email.utils import format_datetime, make_msgid
          from datetime import datetime, timezone
          import hashlib, json, os, pathlib, smtplib, ssl
          product = os.environ['PRODUCT']; slate = os.environ['SLATE_DATE']
          root = pathlib.Path('data/nhl') / slate
          spec = json.loads((root / 'delivery_manifest.json').read_text())[product]
          msg = EmailMessage(policy=SMTP)
          msg['From'] = 'APEX <' + spec['from'] + '>'
          msg['To'] = ', '.join(spec['to'])
          msg['Subject'] = spec['subject']
          msg['Date'] = format_datetime(datetime.now(timezone.utc))
          msg['Message-ID'] = make_msgid(idstring='nhl-' + slate.replace('-', '') + '-' + product.lower(), domain='apexrigor.com')
          msg.set_content(spec['body'])
          for item in spec['files']:
              data = (root / item['filename']).read_bytes()
              assert hashlib.sha256(data).hexdigest() == item['sha256'], item['filename']
              sub = item['filename'].rsplit('.', 1)[1].lower()
              msg.add_attachment(data, maintype='application' if sub == 'pdf' else 'image', subtype=sub, filename=item['filename'])
          with smtplib.SMTP(os.environ['SMTP_HOST'], int(os.environ['SMTP_PORT']), timeout=60) as s:
              s.ehlo(); s.starttls(context=ssl.create_default_context()); s.ehlo()
              s.login(os.environ['SMTP_USER'], os.environ['SMTP_PASSWORD'])
              refused = s.send_message(msg, from_addr=spec['from'], to_addrs=spec['to'])
          print(json.dumps({'product': product, 'slate_date': slate, 'message_id': msg['Message-ID'], 'to': spec['to'], 'refused': refused, 'bytes': len(msg.as_bytes())}))
          PY
