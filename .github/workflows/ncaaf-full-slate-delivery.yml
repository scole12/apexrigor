name: NCAA full-slate product delivery
run-name: NCAA ${{ inputs.product }} ${{ inputs.slate_date }} ${{ inputs.request_id }}

on:
  workflow_dispatch:
    inputs:
      product:
        description: NCAA product to deliver
        required: true
        type: choice
        options:
          - T3
          - T2
          - RESULTS
      slate_date:
        description: NCAA slate date (YYYY-MM-DD)
        required: true
        type: string
      delivery_mode:
        description: Normal delivery or an explicitly authorized one-time result delivery
        required: true
        default: NORMAL
        type: choice
        options:
          - NORMAL
          - RECOVERY
          - CORRECTED
          - FINAL_CORRECTED
          - APEX_FINAL_CORRECTED
          - PRESENTATION_REV2
          - T3_RECOVERY
      request_id:
        description: Immutable shared-publisher request identity
        required: false
        default: manual
        type: string

permissions:
  contents: read

jobs:
  deliver:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      PRODUCT: ${{ inputs.product }}
      SLATE_DATE: ${{ inputs.slate_date }}
      DELIVERY_MODE: ${{ inputs.delivery_mode }}
      REQUEST_ID: ${{ inputs.request_id }}
      SMTP_HOST: ${{ secrets.NCAAF_SMTP_HOST }}
      SMTP_PORT: ${{ secrets.NCAAF_SMTP_PORT }}
      SMTP_USER: ${{ secrets.NCAAF_SMTP_USER }}
      SMTP_PASSWORD: ${{ secrets.NCAAF_SMTP_PASSWORD }}
      EMAIL_FROM: ${{ secrets.NCAAF_EMAIL_FROM }}
      EMAIL_TO: ${{ secrets.NCAAF_EMAIL_TO }}
      EMAIL_INTERNAL: ${{ secrets.NCAAF_EMAIL_INTERNAL }}
    steps:
      - uses: actions/checkout@v4
      - name: Validate canonical NCAA payload and send attachments
        shell: bash
        run: |
          python3 - <<'PY'
          from datetime import datetime, timezone
          from email.message import EmailMessage
          from email.policy import SMTP
          from email.utils import format_datetime, parseaddr
          import hashlib, json, os, pathlib, smtplib, ssl

          slate_date=os.environ['SLATE_DATE']
          parsed_date=datetime.strptime(slate_date,'%Y-%m-%d')
          assert parsed_date.strftime('%Y-%m-%d')==slate_date
          display_date=parsed_date.strftime('%B %-d, %Y')
          date_token=parsed_date.strftime('%Y%m%d')
          delivery_mode=os.environ['DELIVERY_MODE']
          results_explicit_modes=('RECOVERY','CORRECTED','FINAL_CORRECTED','APEX_FINAL_CORRECTED')
          presentation_modes=('PRESENTATION_REV2',)
          t3_recovery_modes=('T3_RECOVERY',)
          explicit_modes=results_explicit_modes+presentation_modes+t3_recovery_modes
          assert delivery_mode in ('NORMAL',)+explicit_modes
          if delivery_mode in results_explicit_modes:
              assert os.environ['PRODUCT']=='RESULTS'
          if delivery_mode in presentation_modes:
              assert os.environ['PRODUCT']=='T2'
          if delivery_mode in t3_recovery_modes:
              assert os.environ['PRODUCT']=='T3'
          product=os.environ['PRODUCT']
          root=pathlib.Path('data/ncaaf')/slate_date
          manifest=json.loads((root/'full_slate_delivery_manifest.json').read_text())
          assert manifest['slate_date']==slate_date
          request_id=os.environ['REQUEST_ID']
          if request_id!='manual':
              assert request_id==manifest['queue_request_id']
          public_sha=manifest['canonical_public_payload_sha256']
          positions=[]
          # A late T-3 recovery is bound directly to its immutable recovery
          # receipt and PDF below.  It must not be coupled to a later public
          # Picks projection, which can legitimately be regenerated after T-2.
          # T-3 is a factual-hydration report and intentionally does not
          # publish or depend on the Picks projection.  The Picks payload can
          # legitimately still identify the prior T-2 at this point.
          if product not in ('T3','RESULTS'):
              public_path=pathlib.Path('data/ncaaf_today.json')
              public_sha=hashlib.sha256(public_path.read_bytes()).hexdigest()
              assert public_sha==manifest['canonical_public_payload_sha256']
              document=json.loads(public_path.read_text(encoding='utf-8'))
              slate=document['slate']
              # Public picks contain issued games, not the full internal schedule.
              display_count=int(manifest.get('display_game_count',manifest['canonical_game_count']))
              assert int(slate['game_count'])==display_count, 'public display game count mismatch'
              if manifest.get('count_scope')=='EXPLICIT_CANONICAL_AND_DISPLAY':
                  assert int(manifest['canonical_game_count'])==int(manifest['issued_game_count'])+int(manifest['internal_market_pending_game_count']), 'internal canonical accounting mismatch'
                  assert display_count==int(manifest['issued_game_count'])+int(manifest['market_pending_game_count']), 'public issued accounting mismatch'
              assert len({str(game['game_id']) for game in slate['games']})==len(slate['games'])
              assert slate['issued_game_count']==manifest['issued_game_count']
              assert slate['official_position_count']==manifest['official_position_count']
              assert slate['market_pending_game_count']==manifest['market_pending_game_count']
              positions=[position for game in slate['games'] for position in game.get('positions',[])]
              assert len(positions)==manifest['official_position_count']
              assert len(slate['games'])==display_count
              assert sum(bool(game.get('positions')) for game in slate['games'])==manifest['issued_game_count']
              assert sum(not game.get('positions') for game in slate['games'])==manifest['market_pending_game_count']
              assert all(float(position['p_selected'])>=0.5 for position in positions)
              assert all(len(position.get('rationale',[]))>=5 for position in positions)
          if delivery_mode not in t3_recovery_modes:
              for filename,expected in manifest['files'].items():
                  assert hashlib.sha256((root/filename).read_bytes()).hexdigest()==expected
              for filename,expected in manifest.get('results_files',{}).items():
                  assert hashlib.sha256(pathlib.Path(filename).read_bytes()).hexdigest()==expected

          if product=='T3':
              if delivery_mode=='T3_RECOVERY':
                  recovery_path=root/f'T3_RECOVERY_RECEIPT_{date_token}.json'
                  recovery=json.loads(recovery_path.read_text(encoding='utf-8'))
                  assert recovery['slate_date_et']==slate_date
                  assert recovery['T3_SCHEDULED_EXECUTION_MISSED']=='YES'
                  assert recovery['T3_RECOVERY_LABELED_LATE']=='YES'
                  assert recovery['outcome_read_count']==0
                  assert recovery['post_kickoff_as_pregame_count']==0
                  assert recovery['unsupported_backfill_count']==0
                  recovery_pdf=f'T3_APEX_NCAAF_DATA_REPORT_{date_token}_LATE_RECOVERY.pdf'
                  assert hashlib.sha256((root/recovery_pdf).read_bytes()).hexdigest()==recovery['recovery_pdf_sha256']
                  subject=f'APEX NCAA Football T-3 Data Report — {display_date} — Late Recovery'
                  body=(
                      f'The scheduled APEX NCAA Football T-minus-3 execution for {display_date} did not complete successfully. '
                      'This attached report is a truthfully labeled late recovery/reconciliation, not an on-time T-3 claim.\n\n'
                      f"Scheduled T-3: {recovery['intended_t3_et']}\n"
                      f"Recovery executed: {recovery['actual_recovery_et']}\n"
                      f"Canonical games: {recovery['canonical_game_count']}\n\n"
                      'Only retained facts with provable availability at or before the intended cutoff are reported. '
                      'Perishable facts without historical availability proof remain explicitly unavailable. No outcomes were read, '
                      'no post-kickoff observation was treated as pregame state, and the sealed T-2 issuance was not changed.\n\n'
                      'Attached:\n'
                      '1. APEX NCAA Football T-3 Late Recovery Data Report PDF\n'
                  )
                  attachments=[recovery_pdf]
              else:
                  hydration_proof=manifest.get('t3_hydration_proof') or {}
                  assert hydration_proof.get('status')=='PASS'
                  assert hydration_proof.get('execution_mode')=='OFFICIAL_T3'
                  assert hydration_proof.get('all_three_post_commit_reopen')=='PASS'
                  assert hydration_proof.get('outcome_read_count')==0
                  hydration_path=root/hydration_proof['path']
                  assert hashlib.sha256(hydration_path.read_bytes()).hexdigest()==hydration_proof['sha256']
                  hydration=json.loads(hydration_path.read_text(encoding='utf-8'))
                  assert hydration['slate_date_et']==slate_date
                  assert hydration['as_of_et']==slate_date
                  assert set(hydration['authorities'])=={'PLAYER','TEAM_LINEUP','HISTORICAL'}
                  for authority in hydration['authorities'].values():
                      assert str(authority['transaction']).startswith('PASS_')
                      assert authority['source_rows_accounted']>0
                      assert authority['source_failure_count']==0
                      assert authority['post_commit_reopen_verify']=='PASS'
                      before_hash=authority.get('observational_main_file_sha256_before') or authority.get('sha256_before')
                      after_hash=authority.get('observational_main_file_sha256_after') or authority.get('sha256_after')
                      assert before_hash and after_hash
                  timing=manifest.get('t3_timing') or {}
                  late_recovery=timing.get('execution_class')=='LATE_RECOVERY'
                  subject=(
                      f'APEX NCAA Football T-3 Data Report — {display_date} — Late Recovery'
                      if late_recovery else
                      f'APEX NCAA Football T-3 Data Report — {display_date}'
                  )
                  body=(
                      (f'The scheduled APEX NCAA Football T-minus-3 Data Report for {display_date} completed as a truthfully labeled late recovery.\n\n'
                       if late_recovery else
                       f'The APEX NCAA Football T-minus-3 Data Report for {display_date} is attached.\n\n')
                      + f"The report accounts for all {manifest['canonical_game_count']} canonical games and records physical PLAYER, "
                      + 'TEAM_LINEUP and HISTORICAL transactions, source-row dispositions, before/after hashes and post-commit reopen verification. '
                      + 'It also reports D2/V5 input readiness, explicit missingness, and zero-filter accounting. T-3 creates no final positions.\n\n'
                      + 'Attached:\n'
                      + '1. APEX NCAA Football T-3 Data Report PDF\n'
                  )
                  attachments=[f'T3_APEX_NCAAF_DATA_REPORT_{date_token}.pdf']
          elif product=='T2':
              late_recovery=(slate_date=='2026-09-04')
              if delivery_mode=='PRESENTATION_REV2':
                  subject=f'APEX NCAA Football T-2 Picks Card — {display_date} — PRESENTATION REV2'
                  body=(
                      f'This is a presentation-only revision of the already-sealed {display_date} NCAA Football T-2 card.\n\n'
                      'No position, line, FanDuel price, APEX probability, tier, engine, capture timestamp or issuance mathematics changed.\n\n'
                      'The revised card uses the established APEX presentation contract and adds sealed-snapshot NCAA rationale detail.\n\n'
                      'Slate summary:\n'
                      f"{manifest['issued_game_count']} FanDuel-issued games\n"
                      f"{manifest['official_position_count']} official positions\n\n"
                      'Live NCAA Picks: https://apexrigor.com/ncaaf\n\n'
                      'Attached in order:\n'
                      '1. Corrected APEX NCAA Football T-2 Picks Card PDF\n'
                      '2. Corrected APEX NCAA Football T-2 1080×1080 PNG\n'
                  )
              else:
                  subject=(
                      f'APEX NCAA Football T-2 Picks Card — {display_date} — Late Recovery'
                      if late_recovery else
                      f'APEX NCAA Football T-2 Picks Card — {display_date}'
                  )
                  body=(
                      f'The APEX NCAA Football T-minus-2 Picks Card for {display_date} is attached.\n\n'
                      + ('This delivery is a truthfully labeled late recovery using the sealed on-time T-2 market capture.\n\n' if late_recovery else '')
                      +
                      'The full slate has been published to the live Picks page for human review:\n\n'
                      'https://apexrigor.com/ncaaf\n\n'
                      'Slate summary:\n'
                      f"{manifest['issued_game_count']} FanDuel-issued games\n"
                      f"{manifest['official_position_count']} positions\n\n"
                      'Attached in order:\n'
                      '1. APEX NCAA Football T-2 Picks Card PDF\n'
                      '2. APEX NCAA Football T-2 Picks Card PNG\n\n'
                      'The public card contains only authentic sealed D2 ATS and V5 Totals positions at the captured FanDuel T-2 market.\n'
                  )
              attachments=[f'NCAAF_T2_FULL_SLATE_{date_token}.pdf',f'NCAAF_T2_PICKS_CARD_{date_token}.png']
          else:
              results=json.loads(pathlib.Path('data/ncaaf_results_cumulative.json').read_text())
              archive=results['positions']
              assert results['graded_position_count']>0
              prior=[row for row in archive if row.get('slate_date')==slate_date]
              def counts(rows):
                  return {key:sum(row.get('result')==key for row in rows) for key in ('W','L','PUSH','VOID','PENDING')}
              prior_all=counts(prior)
              prior_ats=counts([row for row in prior if row.get('market')=='ATS'])
              prior_totals=counts([row for row in prior if row.get('market')=='TOTALS'])
              season=results['season_record']
              def tier_line(engine,key):
                  values=[]
                  for tier in ('WEAK','MODERATE','STRONG','ELITE'):
                      row=results[key][tier]
                      value=f"{tier} {row['W']}W-{row['L']}L"
                      if int(row['PUSH']): value+=f"-{row['PUSH']}P"
                      values.append(value)
                  return engine+': '+' · '.join(values)
              tier_rank={'WEAK':1,'MODERATE':2,'STRONG':3,'ELITE':4}
              ordered=sorted((float(position['issued_probability']),tier_rank[position['tier']]) for position in archive)
              mismatch_count=sum(right[1]<left[1] for left,right in zip(ordered,ordered[1:]))
              results_receipt=hashlib.sha256(pathlib.Path('data/ncaaf_results_cumulative.json').read_bytes()).hexdigest()
              subject=(
                  'APEX NCAA Football Daily Graded Results — Previous Day Slate — Final Corrected'
                  if delivery_mode in ('FINAL_CORRECTED','APEX_FINAL_CORRECTED') else
                  'APEX NCAA Football Daily Graded Results — Previous Day Slate — Corrected'
                  if delivery_mode=='CORRECTED' else
                  f'APEX NCAA Football Results — {display_date} — Recovery'
                  if delivery_mode=='RECOVERY' else
                  'APEX NCAA Football Daily Graded Results — Previous Day Slate'
              )
              body=(
                  "The previous day's APEX NCAA Football results have been graded from the immutable issuance and official full-game outcomes.\n\n"
                  f"Prior-day combined: {prior_all['W']}W-{prior_all['L']}L\n"
                  f"ATS: {prior_ats['W']}W-{prior_ats['L']}L\n"
                  f"Totals: {prior_totals['W']}W-{prior_totals['L']}L\n"
                  "\nNCAA Football cumulative record:\n"
                  f"{season['W']}W-{season['L']}L-{season['PUSH']}P ({100.0 * season['win_rate']:.1f}%)\n\n"
                  "Tier quality:\n"
                  +tier_line('ATS','ats_by_tier')+'\n'
                  +tier_line('TOTALS','totals_by_tier')+'\n\n'
                  f"Probability/tier mismatches: {mismatch_count}\n\n"
                  "Results: https://apexrigor.com/ncaaf/results\n"
                  f"Canonical receipt SHA256: {results_receipt}\n\n"
                  "Every immutable issued position was settled against its exact issued FanDuel line. No engine was rerun and no later market line was substituted.\n\n"
                  "Attachments, in order:\n"
                  "1. Elite detailed graded-results PDF\n"
                  "2. Cumulative APEX NCAA Football record graphic\n"
                  "3. Prior-day single-slate results graphic\n"
              )
              attachments=[
                  f'results/NCAAF_DETAILED_RESULTS_{date_token}.pdf',
                  'results/NCAAF_CUMULATIVE_RECORD_2026.png',
                  f'results/NCAAF_PRIOR_DAY_SLATE_{date_token}.png',
              ]
              assert len(attachments)==3

          recipients=[]
          for raw in (os.environ['EMAIL_TO'],os.environ.get('EMAIL_INTERNAL','')):
              recipients.extend(value.strip() for value in raw.replace(';',',').split(',') if value.strip())
          recipients=list(dict.fromkeys(recipients))
          assert recipients
          if product in ('T3','T2'):
              # The owner-approved NCAA live-stage contract is Scott, Ray and
              # Jeff.  Preserve the configured addresses while excluding the
              # older grader-only Debbie recipient from live-stage products.
              recipients=[
                  value for value in recipients
                  if value.lower()!='debbiemille@gmail.com'
              ]
              assert len(recipients)==3, 'NCAA live-stage recipient contract must resolve to exactly three recipients'
          else:
              assert 'debbiemille@gmail.com' in {value.lower() for value in recipients}, 'required NCAA grader recipient Debbie is absent'
          message=EmailMessage()
          message['From']=os.environ['EMAIL_FROM']
          message['To']=', '.join(recipients)
          message['Subject']=subject
          message['Date']=format_datetime(datetime.now(timezone.utc))
          message['Message-ID']=(
              f"<ncaaf-{date_token}-{product.lower()}-{delivery_mode.lower()}-{os.environ['GITHUB_RUN_ID']}@apexrigor.com>"
              if delivery_mode in explicit_modes else
              f"<ncaaf-{date_token}-{product.lower()}-{public_sha[:20]}@apexrigor.com>"
          )
          message['X-APEX-NCAA-Public-Payload-SHA256']=public_sha
          message['X-APEX-NCAA-Delivery-Mode']=delivery_mode
          message.set_content(body)
          attachment_evidence=[]
          for filename in attachments:
              path=root/filename
              payload=path.read_bytes()
              if path.suffix=='.pdf':
                  content_type='application/pdf'
                  message.add_attachment(payload,maintype='application',subtype='pdf',filename=pathlib.Path(filename).name)
              else:
                  content_type='image/png'
                  message.add_attachment(payload,maintype='image',subtype='png',filename=pathlib.Path(filename).name)
              attachment_evidence.append({
                  'filename':pathlib.Path(filename).name,
                  'content_type':content_type,
                  'size_bytes':len(payload),
                  'sha256':hashlib.sha256(payload).hexdigest(),
              })

          mime_bytes=message.as_bytes(policy=SMTP)
          evidence_stem=f'NCAAF_{product}_{delivery_mode}'
          pathlib.Path(evidence_stem+'_MESSAGE.eml').write_bytes(mime_bytes)

          host=os.environ['SMTP_HOST']; port=int(os.environ['SMTP_PORT']); context=ssl.create_default_context()
          if port==465:
              client=smtplib.SMTP_SSL(host,port,context=context,timeout=45)
          else:
              client=smtplib.SMTP(host,port,timeout=45)
              client.ehlo(); client.starttls(context=context); client.ehlo()
          with client:
              client.login(os.environ['SMTP_USER'],os.environ['SMTP_PASSWORD'])
              envelope_from=parseaddr(str(message['From']))[1]
              mail_code,mail_text=client.mail(envelope_from)
              assert 200 <= mail_code < 300, (mail_code,mail_text)
              recipient_responses=[]
              for recipient in recipients:
                  code,text=client.rcpt(recipient)
                  recipient_responses.append({
                      'recipient':recipient,
                      'code':code,
                      'text':text.decode('utf-8','replace') if isinstance(text,bytes) else str(text),
                      'accepted':code in (250,251),
                  })
              assert all(row['accepted'] for row in recipient_responses), recipient_responses
              smtp_code,smtp_text=client.data(mime_bytes)
              smtp_response=(smtp_text.decode('utf-8','replace') if isinstance(smtp_text,bytes) else str(smtp_text))
              assert smtp_code==250, (smtp_code,smtp_response)
              accepted_at=datetime.now(timezone.utc).isoformat().replace('+00:00','Z')
              provider_queue_id='UNAVAILABLE_NOT_SEPARATELY_EXPOSED'
              lower=smtp_response.lower()
              if 'queued as ' in lower:
                  provider_queue_id=smtp_response[lower.index('queued as ')+10:].split()[0].strip('.,;')
              evidence={
                  'schema_version':(
                      'apex.ncaaf.presentation_revision_email_evidence.v1'
                      if delivery_mode in presentation_modes
                      else 'apex.ncaaf.t3_recovery_email_evidence.v1'
                      if delivery_mode in t3_recovery_modes
                      else 'apex.ncaaf.results_email_evidence.v3'
                  ),
                  'slate_date':slate_date,
                  'delivery_mode':delivery_mode,
                  'request_id':request_id,
                  'from':str(message['From']),
                  'reply_to':str(message.get('Reply-To','')),
                  'to':recipients,
                  'cc':[],
                  'bcc':[],
                  'envelope_from':envelope_from,
                  'envelope_recipients':recipients,
                  'subject':subject,
                  'message_id':str(message['Message-ID']),
                  'attachment_count':len(attachment_evidence),
                  'attachments':attachment_evidence,
                  'mime_sha256':hashlib.sha256(mime_bytes).hexdigest(),
                  'smtp_mail_response_code':mail_code,
                  'smtp_mail_response_text':mail_text.decode('utf-8','replace') if isinstance(mail_text,bytes) else str(mail_text),
                  'smtp_recipient_responses':recipient_responses,
                  'smtp_data_response_code':smtp_code,
                  'smtp_data_response_text':smtp_response,
                  'provider_queue_id':provider_queue_id,
                  'provider_accepted_at':accepted_at,
                  'provider_delivery_tracking_available':False,
                  'delivery_state':'PROVIDER_ACCEPTED',
                  'credentials_recorded':False,
              }
              pathlib.Path(evidence_stem+'_TRANSACTION.json').write_text(
                  json.dumps(evidence,sort_keys=True,indent=2)+'\n',encoding='utf-8'
              )
              prefix=delivery_mode
              print(prefix+'_MESSAGE_ID='+str(message['Message-ID']))
              print(prefix+'_ENVELOPE_RCPT_COUNT='+str(len(recipients)))
              print(prefix+'_SMTP_RESPONSE_CODE='+str(smtp_code))
              print(prefix+'_PROVIDER_QUEUE_ID='+provider_queue_id)
              print(prefix+'_ACCEPTED_AT='+accepted_at)
          print('EMAIL_SEND=PASS')
          print('PRODUCT='+product)
          print('CANONICAL_GAME_COUNT='+str(manifest['canonical_game_count']))
          print('ISSUED_GAME_COUNT='+str(manifest['issued_game_count']))
          print('POSITION_COUNT='+str(manifest['official_position_count']))
          print('ATTACHMENT_COUNT='+str(len(attachments)))
          print('PUBLIC_PAYLOAD_SHA256='+public_sha)
          PY
      - name: Preserve NCAA provider transaction evidence
        uses: actions/upload-artifact@v4
        with:
          name: ncaaf-${{ inputs.product }}-${{ inputs.delivery_mode }}-${{ inputs.slate_date }}-${{ github.run_id }}
          path: |
            NCAAF_*_${{ inputs.delivery_mode }}_MESSAGE.eml
            NCAAF_*_${{ inputs.delivery_mode }}_TRANSACTION.json
          if-no-files-found: error
