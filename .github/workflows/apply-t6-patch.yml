name: Apply T-6 read patch

on:
  push:
    branches:
      - cursor/t6-rates-and-timeout-b962
    paths:
      - t6.patch

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: cursor/t6-rates-and-timeout-b962
          token: ${{ github.token }}
      - name: Apply the read patch and remove this helper
        run: |
          set -euo pipefail
          if [ ! -f t6.patch ]; then
            echo 'patch already applied'
            exit 0
          fi
          git apply --index t6.patch
          git rm -f t6.patch .github/workflows/apply-t6-patch.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m "$(cat <<'EOF'
Read each player's newest rating and last 20 box rows directly

The Oct 21 publish was canceled at the 20 second cap while the players query sorted every season's ratings. The per-player rating lookup is back, the box history uses the same shape, and the read-only statement timeout is 60 seconds.
EOF
)"
          git push origin HEAD:cursor/t6-rates-and-timeout-b962
