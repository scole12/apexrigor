name: Apply T-6 read patch

"on":
  push:
    branches:
      - cursor/t6-rates-and-timeout-b962
    paths:
      - t6.patch
      - .github/workflows/apply-t6-patch.yml

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: cursor/t6-rates-and-timeout-b962
          token: ${{ github.token }}
      - name: Apply the read patch and remove this helper
        run: |
          set -euo pipefail
          if [ ! -f t6.patch ]; then
            echo 'patch already applied'
            exit 0
          fi
          git apply --index t6.patch
          git rm -f t6.patch .github/workflows/apply-t6-patch.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'Read each player newest rating and last 20 box rows directly'
          git push origin HEAD:cursor/t6-rates-and-timeout-b962
