<body>
<div class="shell" data-picks-state="issued" data-public-issuance="true" data-sport="NCAAF" data-slate-date="2026-09-03">

    <div class="hero-mark"><svg viewBox="0 0 44 44" xmlns="http://www.w3.org/2000/svg"><polygon points="22,6 38,36 6,36"/></svg></div>

  <nav class="sport-nav" aria-label="Sport selector">
    <a href="/">MLB</a>

  </div>
  <div class="section-head picks-board-head"><div class="title">FULL-GAME CARD</div><div class="meta mono" id="slate-meta">LOADING AUTHORITATIVE SLATE</div></div>
  <main class="picks-page"><div class="picks-board" id="games" aria-live="polite"></div></main>
</div>
<script>
const esc=v=>String(v??"").replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;","\"":"&quot;","'":"&#39;"}[c]));
const signed=v=>Number(v)>0?("+"+v):String(v);
function issuedPanel(p){
 const headline=p.display_selection||(p.market_type==="ATS"?esc(p.selection)+" "+esc(p.line):esc(p.direction)+" "+esc(p.line));
 return '<section class="market-panel"><div class="market-label">FULL-GAME '+esc(p.market_type)+'</div><div class="market-panel-head"><span class="pick-headline">'+esc(headline)+'</span><span class="tier-badge tier-badge--'+esc(String(p.rating||"").toLowerCase())+'">'+esc(p.rating||"")+'</span></div><div class="meta mono">SEALED T-2</div></section>';
}
function unissuedPanel(type, game){
 const label=type==="ATS"?"FULL-GAME ATS":"FULL-GAME TOTALS";
 const tbd=game.schedule_time_status==="UNRESOLVED_TBD";
 const lock=tbd?"Kickoff unresolved. No APEX position is displayed.":"UNISSUED until this game's T-2. No APEX position is displayed.";
 return '<section class="market-panel"><div class="market-label">'+label+'</div><div class="market-state">UNISSUED</div><div class="market-lock">'+lock+'</div></section>';
}
fetch("/data/ncaaf_today.json",{cache:"no-store"}).then(r=>{if(!r.ok)throw new Error("HTTP "+r.status);return r.json()}).then(doc=>{
 const s=doc.slate;
 const issued=Number(s.issued_game_count||0);
 const mode=issued>0?"SEALED T-2":"UNISSUED";
 document.getElementById("slate-meta").textContent=s.slate_date_et+" · "+s.game_count+" GAMES · "+issued+" ISSUED · "+mode;
 const shell=document.querySelector(".shell");
 if(shell){shell.setAttribute("data-slate-date", s.slate_date_et);shell.setAttribute("data-public-issuance", issued>0?"true":"false");}
 document.getElementById("games").innerHTML=s.games.map((g,i)=>{
   const by=Object.fromEntries((g.positions||[]).map(p=>[p.market_type,p]));
   const clock=g.schedule_time_status==="UNRESOLVED_TBD"?"TIME TBA":esc(g.kickoff_display_et||"TIME TBA");
   const ats=by.ATS?issuedPanel(by.ATS):unissuedPanel("ATS", g);
   const tot=by.TOTALS?issuedPanel(by.TOTALS):unissuedPanel("TOTALS", g);
   return '<article class="game-module" data-game="'+esc(g.game_id)+'"><header class="game-header"><div class="game-num mono">G'+String(i+1).padStart(2,"0")+'</div><div class="game-meta"><h2 class="game-matchup">'+esc(g.matchup)+'</h2><p class="game-context">'+esc(String(g.fbs_fcs_classification||"").replaceAll("_"," "))+" · "+esc(g.venue||"Venue not published")+'</p></div><div class="game-time mono">'+clock+'</div></header><div class="market-grid">'+ats+tot+'</div></article>';
 }).join("");
}).catch(e=>{document.getElementById("slate-meta").textContent="NCAA DATA UNAVAILABLE";document.getElementById("games").innerHTML='<div class="empty-state">'+esc(e.message)+"</div>";});
</script>
