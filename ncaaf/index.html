  <div class="section-head picks-board-head">
    <div class="title">TODAY'S CARD</div>
    <div class="meta mono" id="slate-meta">SEALED SLATE</div>
  </div>
  <main class="picks-page"><div class="picks-board" id="games" aria-live="polite"></div></main>
  <div class="tag">THE MATH SPEAKS.</div>
  <div class="foot mono">APEX RESEARCH · WALK-FORWARD VALIDATED · NCAA FULL-GAME ATS + TOTALS</div>
</div>
<script>
const esc=v=>String(v??"").replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;","\"":"&quot;","'":"&#39;"}[c]));
const dateLabel=value=>{
 const [y,m,d]=String(value).split("-").map(Number);
 return new Intl.DateTimeFormat("en-US",{weekday:"long",year:"numeric",month:"long",day:"numeric",timeZone:"UTC"}).format(new Date(Date.UTC(y,m-1,d))).toUpperCase();
};
const marketName=value=>value==="ATS"?"FULL-GAME ATS":"FULL-GAME TOTALS";
function issuedPanel(p){
 const headline=p.display_selection||(p.market_type==="ATS"?String(p.selection)+" "+String(p.line):String(p.direction)+" "+String(p.line));
 const rationale=Array.isArray(p.rationale)?p.rationale:[];
 return '<section class="market-panel" data-market="'+esc(p.market_type)+'" data-position-state="SEALED">'
  +'<div class="market-label">'+marketName(p.market_type)+'</div>'
  +'<div class="market-panel-head"><span class="pick-headline">'+esc(headline)+'</span>'
  +'<span class="rating-label">APEX WIN PROBABILITY RATING</span>'
  +'<span class="tier-badge tier-badge--'+esc(String(p.rating||"").toLowerCase())+'">'+esc(p.rating||"")+'</span></div>'
  +'<div class="meta mono">APEX WIN PROBABILITY: '+(Number(p.p_selected)*100).toFixed(1)+'% · Sportsbook: FanDuel</div>'
  +'<div class="rationale-copy">'+rationale.map(text=>'<p>'+esc(text)+'</p>').join("")+'</div></section>';
}
fetch("/data/ncaaf_today.json",{cache:"no-store"}).then(r=>{if(!r.ok)throw new Error("HTTP "+r.status);return r.json()}).then(doc=>{
 const s=doc.slate;
 const visibleGames=Array.isArray(s.games)?s.games:[];
 const positions=visibleGames.reduce((count,g)=>count+(Array.isArray(g.positions)?g.positions.length:0),0);
 const epoch=doc.active_engine_epoch||{};
 const ats=((epoch.ATS||{}).model_id)||"D2";
 const totals=((epoch.TOTALS||{}).model_id)||"TOTALS-V5-RECONCILED-POOL";
 document.getElementById("slate-meta").textContent=dateLabel(s.slate_date_et)+" · "+visibleGames.length+" FANDUEL-ISSUED GAMES · "+positions+" POSITIONS · ATS MODEL "+ats+" · TOT MODEL "+totals;
 const shell=document.querySelector(".shell");
 if(shell){shell.setAttribute("data-slate-date",s.slate_date_et);shell.setAttribute("data-public-issuance",positions>0?"true":"false");}
 document.getElementById("games").innerHTML=visibleGames.map((g,i)=>{
   const issuedPositions=(Array.isArray(g.positions)?g.positions:[]).filter(p=>p&&p.market_type);
   const clock=g.schedule_time_status==="UNRESOLVED_TBD"?"TIME TBA":esc(g.kickoff_display_et||"TIME TBA");
   const panels=issuedPositions.slice().sort((a,b)=>(a.market_type==="ATS"?0:1)-(b.market_type==="ATS"?0:1)).map(issuedPanel).join("");
   const context=esc(String(g.fbs_fcs_classification||"").replaceAll("_"," "))+" · "+esc(g.venue||"Venue not published");
   return '<article class="game-module" data-game="'+esc(g.game_id)+'" data-game-state="ISSUED">'
    +'<header class="game-header"><div class="game-num mono">G'+String(i+1).padStart(2,"0")+'</div><div class="game-meta">'
    +'<h2 class="game-matchup">'+esc(g.matchup)+'</h2><p class="game-pitchers mono">'+context+'</p></div><div class="game-time mono">'+clock+'</div></header>'
    +'<div class="market-grid'+(issuedPositions.length===1?' market-grid--single':'')+'">'+panels+'</div></article>';
 }).join("");
}).catch(e=>{document.getElementById("slate-meta").textContent="NCAA DATA UNAVAILABLE";document.getElementById("games").innerHTML='<div class="empty-state">'+esc(e.message)+"</div>";});
</script>
