<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0,viewport-fit=cover">

<meta name="description" content="APEX full-game NCAA Football ATS and Totals forecasts.">
<link rel="icon" type="image/svg+xml" href="/favicon.svg?v=apex-20260629-tier-perf">
<link rel="icon" type="image/x-icon" href="/favicon.ico?v=apex-20260629-tier-perf" sizes="32x32">
<link rel="icon" type="image/png" sizes="32x32" href="/favicon-32x32.png?v=apex-20260629-tier-perf">
<link rel="icon" type="image/png" sizes="16x16" href="/favicon-16x16.png?v=apex-20260629-tier-perf">
<link rel="apple-touch-icon" sizes="180x180" href="/apple-touch-icon.png?v=apex-20260629-tier-perf">
<link rel="manifest" href="/site.webmanifest?v=apex-20260629-tier-perf">
<meta name="theme-color" content="#000000">
<meta property="og:type" content="website">
<meta property="og:site_name" content="APEX">
<meta property="og:title" content="APEX — NCAA Football">
<meta property="og:description" content="Full-game NCAA Football ATS and Totals forecasts.">
<meta property="og:url" content="https://apexrigor.com/ncaaf">
<meta property="og:image" content="https://apexrigor.com/og-image.png?v=apex-20260629-tier-perf">
<link rel="stylesheet" href="/assets/apex.css?v=apex-20260629-tier-perf">
</head>
<body>
<div class="shell">
  <div class="hero">
    <div class="hero-mark"><svg viewBox="0 0 44 44" xmlns="http://www.w3.org/2000/svg"><polygon points="22,6 38,36 6,36"/></svg></div>
    <div class="hero-wordmark">APEX</div>
    <div class="hero-rule"></div>
    <div class="hero-tag">NCAA FOOTBALL</div>
    <div class="hero-math">The Math Speaks.</div>
  </div>
  <nav class="nav sport-switcher" aria-label="Sport">
    <a href="/">MLB</a>
    <a href="/ncaaf" class="active">NCAA</a>
    <a href="/mma">MMA</a>
  </nav>
  <div class="section-head picks-board-head">
    <div class="title">FULL-GAME CARD</div>
    <div class="meta mono" id="slate-meta">LOADING CERTIFIED SLATE</div>
  </div>
  <main class="picks-page">
    <div class="picks-board" id="games" aria-live="polite"></div>
  </main>
</div>
<script>
const escapeHtml = value => String(value ?? "").replace(/[&<>"']/g, char => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[char]));
const positionMarkup = position => `<div class="market-panel"><div class="market-label">FULL-GAME ${escapeHtml(position.market_type)}</div><div class="market-panel-head"><span class="pick-headline">${escapeHtml(position.selection)} ${escapeHtml(position.line)}</span><span class="tier-badge tier-badge--${escapeHtml(String(position.rating).toLowerCase())}">${escapeHtml(position.rating)}</span></div><div class="meta mono">FANDUEL · ${escapeHtml(position.price)}</div></div>`;
fetch("/data/ncaaf_today.json", {cache:"no-store"}).then(response => { if (!response.ok) throw new Error(`HTTP ${response.status}`); return response.json(); }).then(document => {
  const slate = document.slate;
  document.getElementById("slate-meta").textContent = `${slate.slate_date_et} · ${slate.games.length} DIVISION I GAMES · ATS + TOTALS`;
  document.getElementById("games").innerHTML = slate.games.map((game, index) => {
    const markets = game.positions.length ? game.positions.map(positionMarkup).join("") : `<div class="market-panel"><div class="market-label">MARKET STATUS</div><div class="pick-headline">${escapeHtml(game.market_status)}</div><div class="meta mono">NO WAGER INVENTED</div></div>`;
    return `<article class="game-module" data-game="${escapeHtml(game.game_id)}"><header class="game-header"><div class="game-num mono">G${String(index + 1).padStart(2,"0")}</div><div class="game-meta"><h2 class="game-matchup">${escapeHtml(game.matchup)}</h2></div><div class="game-time mono">${escapeHtml(game.kickoff_et)}</div></header><div class="market-grid">${markets}</div></article>`;
  }).join("");
}).catch(error => {
  document.getElementById("slate-meta").textContent = "NCAA DATA UNAVAILABLE";
  document.getElementById("games").innerHTML = `<article class="game-module"><div class="meta mono">${escapeHtml(error.message)}</div></article>`;
});
</script>
</body>
</html>
