<div class="section-head"><div class="title">NCAA RESULTS</div><div class="meta mono" id="results-meta">OFFICIAL IMMUTABLE LEDGER</div></div>
<main id="results-root" aria-live="polite"></main></div>
<script>
const esc=v=>String(v??"").replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const rec=r=>`${r.W}-${r.L}-${r.PUSH}P`+(r.VOID?` · ${r.VOID} VOID`:"")+(r.PENDING?` · ${r.PENDING} PENDING`:"");
const rate=r=>r.win_rate==null?"N/A":`${(100*r.win_rate).toFixed(1)}%`;
const dateLabel=value=>new Intl.DateTimeFormat("en-US",{timeZone:"UTC",year:"numeric",month:"long",day:"numeric"}).format(new Date(`${value}T00:00:00Z`));
const tierRows=groups=>`<table class="results"><thead><tr><th>Tier</th><th>Record</th><th>Win Rate</th></tr></thead><tbody>${["WEAK","MODERATE","STRONG","ELITE"].map(t=>{const r=groups[t];return `<tr><td class="mono">${esc(t[0]+t.slice(1).toLowerCase())}</td><td class="mono">${rec(r)}</td><td class="mono muted">${rate(r)}</td></tr>`}).join("")}</tbody></table>`;
fetch("/data/ncaaf_results_cumulative.json",{cache:"no-store"}).then(r=>{if(!r.ok)throw new Error(`HTTP ${r.status}`);return r.json()}).then(s=>{
 const rows=s.positions||[];
 if(!rows.length){document.getElementById("results-root").innerHTML=`<div class="empty-state">2026 NCAA RESULTS BEGIN WITH THE FIRST GRADED APEX NCAA SLATE.</div>`;return}
 const latest=s.latest_graded_slate; const detail=rows.filter(r=>r.slate_date===latest); const latestAll={W:0,L:0,PUSH:0,VOID:0,PENDING:0}; const latestATS={...latestAll}; const latestTotals={...latestAll};
 detail.forEach(r=>{latestAll[r.result]++;(r.market==="ATS"?latestATS:latestTotals)[r.result]++});
 document.getElementById("results-meta").textContent=`${dateLabel(latest).toUpperCase()} · ${s.total_tracked_positions} POSITIONS TRACKED`;
 document.getElementById("results-root").innerHTML=`<section class="result-section"><h2>Season Record</h2><div class="banner" data-apex-season-record="${rec(s.season_record)}" data-apex-season-win-rate="${rate(s.season_record)}" data-apex-ats-record="${rec(s.ats_record)}" data-apex-totals-record="${rec(s.totals_record)}"><div class="cell"><div class="label">Overall</div><div class="val mono">${rec(s.season_record)}</div></div><div class="cell"><div class="label">Win Rate</div><div class="val mono">${rate(s.season_record)}</div></div><div class="cell"><div class="label">Full-Game ATS</div><div class="val mono">${rec(s.ats_record)}</div></div><div class="cell"><div class="label">Full-Game Total</div><div class="val mono">${rec(s.totals_record)}</div></div></div></section><div class="section-head"><div class="title">As-Issued Tier Performance</div><div class="meta mono">${esc(s.first_graded_slate)} — ${esc(s.latest_graded_slate)}</div></div><div class="tier-grid"><div class="tier-col"><div class="tier-sub">ATS by Confidence Tier</div>${tierRows(s.ats_by_tier)}</div><div class="tier-col"><div class="tier-sub">Totals by Confidence Tier</div>${tierRows(s.totals_by_tier)}</div></div><div class="tier-sub">Combined NCAA by Confidence Tier</div><div class="tier-single">${tierRows(s.combined_by_tier)}</div><div class="section-head"><div class="title">Latest Graded Slate</div><div class="meta mono">${dateLabel(latest).toUpperCase()}</div></div><div class="banner"><div class="cell"><div class="label">Combined</div><div class="val mono">${rec(latestAll)}</div></div><div class="cell"><div class="label">ATS</div><div class="val mono">${rec(latestATS)}</div></div><div class="cell"><div class="label">Totals</div><div class="val mono">${rec(latestTotals)}</div></div><div class="cell"><div class="label">Positions</div><div class="val mono">${detail.length}</div></div></div><section class="result-section"><h2>${dateLabel(latest)} Position Ledger</h2><table class="results"><thead><tr><th>Game</th><th>Matchup</th><th>Market</th><th>Pick</th><th>Tier</th><th>Result</th></tr></thead><tbody>${detail.map(r=>`<tr><td>${esc(r.game_id.slice(-6))}</td><td>${esc(r.matchup)}</td><td>${esc(r.market==="TOTALS"?"TOTAL":r.market)}</td><td>${esc(r.pick)}</td><td>${esc(r.as_issued_tier)}</td><td>${esc(r.result)}</td></tr>`).join("")}</tbody></table></section>`;
}).catch(e=>document.getElementById("results-root").innerHTML=`<div class="empty-state">RESULTS DATA UNAVAILABLE · ${esc(e.message)}</div>`);
</script></body></html>
