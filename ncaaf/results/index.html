<link rel="stylesheet" href="/assets/apex.css?v=apex-20260825-ncaaf-ops"></head><body><div class="shell">
<div class="hero"><div class="hero-mark"><svg viewBox="0 0 44 44" xmlns="http://www.w3.org/2000/svg"><polygon points="22,6 38,36 6,36"/></svg></div><div class="hero-wordmark">APEX</div><div class="hero-rule"></div><div class="hero-tag">NCAA FOOTBALL</div><div class="hero-math">The Math Speaks.</div></div>
<div class="apex-nav-stack"><nav class="sport-nav" aria-label="Sport selector"><a href="/results">MLB</a><a href="/ncaaf/results" class="active" aria-current="true">NCAA FOOTBALL</a><a href="/mma/results">MMA / UFC</a></nav><nav class="section-nav" aria-label="NCAA Football sections"><a href="/ncaaf">PICKS</a><a href="/ncaaf/results" class="active" aria-current="page">RESULTS</a><a href="/ncaaf/about">ABOUT</a></nav></div>
<div class="section-head"><div class="title">NCAA RESULTS</div><div class="meta mono" id="results-meta">OFFICIAL IMMUTABLE LEDGER</div></div>
<main id="results-root" aria-live="polite"></main></div>
<script>
const esc=v=>String(v??"").replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const rec=r=>`${r.W}-${r.L}-${r.PUSH}`+(r.VOID?` · ${r.VOID} VOID`:"");
const tierTable=(title,groups)=>`<section class="result-section"><h2>${title}</h2><table class="results"><thead><tr><th>Tier</th><th>Record</th><th>Pending</th></tr></thead><tbody>${Object.entries(groups).map(([t,r])=>`<tr><td>${esc(t)}</td><td>${rec(r)}</td><td class="muted">${r.PENDING}</td></tr>`).join("")}</tbody></table></section>`;
Promise.all([fetch("/data/ncaaf_results_summary.json",{cache:"no-store"}).then(r=>r.json()),fetch("/data/ncaaf_results_archive.json",{cache:"no-store"}).then(r=>r.json())]).then(([s,rows])=>{
 document.getElementById("results-meta").textContent=`${s.graded_position_count} GRADED · ${s.pending_position_count} PENDING`;
 if(!rows.length){document.getElementById("results-root").innerHTML=`<div class="empty-state">2026 NCAA RESULTS BEGIN WITH THE FIRST GRADED APEX NCAA SLATE.</div>`;return}
 const latest=rows.map(r=>r.date).sort().at(-1); const detail=rows.filter(r=>r.date===latest);
 document.getElementById("results-root").innerHTML=`<section class="result-section"><h2>Season Record</h2><div class="banner"><div class="cell"><div class="label">Wins</div><div class="val">${s.season_record.W}</div></div><div class="cell"><div class="label">Losses</div><div class="val">${s.season_record.L}</div></div><div class="cell"><div class="label">Pushes</div><div class="val">${s.season_record.PUSH}</div></div><div class="cell"><div class="label">Pending</div><div class="val">${s.season_record.PENDING}</div></div></div></section>${tierTable("Full-Game ATS by Confidence Tier",s.ats_by_tier)}${tierTable("Full-Game Totals by Confidence Tier",s.totals_by_tier)}${tierTable("Combined NCAA by Confidence Tier",s.combined_by_tier)}<section class="result-section"><h2>Gameday Archive</h2><div class="meta mono">${[...new Set(rows.map(r=>r.date))].sort().reverse().map(esc).join(" · ")}</div></section><section class="result-section"><h2>Latest Slate Detail · ${esc(latest)}</h2><table class="results"><thead><tr><th>Game</th><th>Matchup</th><th>Market</th><th>Pick</th><th>Tier</th><th>Result</th></tr></thead><tbody>${detail.map(r=>`<tr><td>${esc(r.game_id.slice(-6))}</td><td>${esc(r.matchup)}</td><td>${esc(r.market)}</td><td>${esc(r.pick)}</td><td>${esc(r.tier)}</td><td>${esc(r.result)}</td></tr>`).join("")}</tbody></table></section>`;
}).catch(e=>document.getElementById("results-root").innerHTML=`<div class="empty-state">RESULTS DATA UNAVAILABLE · ${esc(e.message)}</div>`);
</script></body></html>
