<script>
const esc=v=>String(v??"").replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;","\"":"&quot;","'":"&#39;"}[c]));
const stamp=v=>new Intl.DateTimeFormat("en-US",{timeZone:"America/New_York",weekday:"short",month:"short",day:"numeric",hour:"numeric",minute:"2-digit",timeZoneName:"short"}).format(new Date(v));
fetch("/data/nfl_today.json",{cache:"no-store"}).then(r=>{if(!r.ok)throw new Error("HTTP "+r.status);return r.json()}).then(d=>{
  const games=d.slate.games||[];
  if(d.public_issuance!==false||d.position_count!==0||!games.every(g=>Array.isArray(g.positions)&&g.positions.length===0))throw new Error("NFL release-state invariant failed");
  document.getElementById("slate-meta").textContent=`${games.length} GAMES · TECHNICAL READY · SCIENCE BLOCKED · 0 POSITIONS`;
  const gate='<article class="game-module" data-game-state="SCIENCE_BLOCKED"><header class="game-header"><div class="game-num mono">GATE</div><div class="game-meta"><h2 class="game-matchup">No NFL picks issued</h2><p class="game-pitchers mono">ATS · QB/RB/WR PROPS · FULL-GAME TOTALS</p></div><div class="game-time mono">0 POSITIONS</div></header><div class="market-grid market-grid--single"><section class="market-panel"><div class="market-label">SCIENTIFIC RELEASE STATE</div><div class="pick-headline">NO QUALIFIED CHAMPION</div><div class="rationale-copy"><p>The acquisition, point-in-time T-3, T-2 serving, and exact-issuance grader machinery is technically ready. Each engine lane remains closed until a candidate earns promotion through chronological evidence. APEX does not publish a forecast, probability, or market position from review scaffolding.</p></div></section></div></article>';
  const schedule=games.map((g,i)=>'<article class="game-module" data-game="'+esc(g.game_id)+'" data-game-state="SCHEDULED"><header class="game-header"><div class="game-num mono">G'+String(i+1).padStart(2,"0")+'</div><div class="game-meta"><h2 class="game-matchup">'+esc(g.matchup)+'</h2><p class="game-pitchers mono">2026 REGULAR SEASON · WEEK '+esc(g.week)+' · CANONICAL SCHEDULE</p></div><div class="game-time mono">'+esc(stamp(g.kickoff_utc))+'</div></header></article>').join("");
  document.getElementById("games").innerHTML=gate+schedule;
}).catch(e=>{document.getElementById("slate-meta").textContent="NFL STATE UNAVAILABLE";document.getElementById("games").innerHTML='<div class="empty-state">FAIL CLOSED · '+esc(e.message)+'</div>'});
</script>
