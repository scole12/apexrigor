fetch("/data/nfl_results_summary.json",{cache:"no-store"}).then(r=>{if(!r.ok)throw new Error("HTTP "+r.status);return r.json()}).then(d=>{
  if(d.issued_position_count!==0||d.graded_position_count!==0||d.ungraded_position_count!==0)throw new Error("NFL result-state invariant failed");
  document.getElementById("result-meta").textContent="0 ISSUED · 0 GRADED · SCIENCE BLOCKED";
  document.getElementById("result").innerHTML='<article class="game-module"><header class="game-header"><div class="game-num mono">LEDGER</div><div class="game-meta"><h2 class="game-matchup">No NFL performance claimed</h2><p class="game-pitchers mono">NO SEALED NFL POSITIONS EXIST</p></div><div class="game-time mono">0–0</div></header><div class="market-grid market-grid--single"><section class="market-panel"><div class="market-label">ISSUED-VERSUS-GRADED RECONCILIATION</div><div class="pick-headline">EMPTY BY SCIENTIFIC DESIGN</div><div class="rationale-copy"><p>'+esc(d.message)+'</p><p>The grader is implemented to settle exact sealed issuance only. It will not reconstruct yesterday’s probability from a later model.</p></div></section></div></article>';
}).catch(e=>{document.getElementById("result-meta").textContent="NFL RESULTS UNAVAILABLE";document.getElementById("result").innerHTML='<div class="empty-state">FAIL CLOSED · '+esc(e.message)+'</div>'});
